<style>

html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:24px 16px 40px;text-align:center}
h1{margin:0 0 4px;font-size:28px}
.sub{margin:0 0 12px;color:var(--muted);font-size:15px}
.stats{margin-bottom:10px;color:var(--muted)}.stats b{color:var(--ink)}
#board{position:relative;margin:0 auto 14px;background:var(--panel);border-radius:14px;overflow:hidden}
.t{position:absolute;left:0;top:0;border-radius:6px;background-repeat:no-repeat;transition:transform .7s ease-in-out}
#board.nt .t{transition:none}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input[type=text],select{font:inherit;font-size:18px;padding:10px;border-radius:8px;border:2px solid var(--pur);background:transparent;color:var(--ink);text-align:center;width:190px}
select{width:auto;background:var(--panel)}
input[type=file]{color:var(--muted);font:inherit;font-size:14px;max-width:220px}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:0;background:var(--pur);color:#1a1033;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
#msg{min-height:26px;font-weight:600;margin:6px 0 12px}
details{background:var(--panel);border-radius:14px;padding:12px 16px;text-align:left;color:var(--muted);font-size:14px}
summary{cursor:pointer;color:var(--ink);font-weight:600}
</style></head><body><main>
<h1>Guess the Picture</h1>
<p class="sub">The tiles keep moving. Guess the picture.</p>
<div id="board"></div>
<div id="hint" class="sub"></div>
<div class="row"><input type="text" id="g" placeholder="Your guess" autocomplete="off"><button id="go">Guess</button></div>
<div id="msg" role="status"></div>
<div class="row"><button class="ghost" id="nx">New game</button><button class="ghost" id="hb">Hint</button><button class="ghost" id="sk">Give up</button></div>
<details><summary>Add your own real photos</summary>
<p>Choose one or many photos. For one photo, type its answer first. For several, each file name is the answer (eiffel_tower.jpg becomes "eiffel tower"). Photos are not saved after you close the page.</p>
<div class="row"><input type="text" id="ans" placeholder="Answer (one photo)"><input type="file" id="file" accept="image/*" multiple></div>
<div id="added"></div></details>
</main>

function confetti(){

    if(t<160)requestAnimationFrame(f);else c.remove();
  })();
}
